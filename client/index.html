<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Mo phong He Mat Troi 3D voi du lieu thien van thuc tu NASA/JPL Horizons, ho tro offline." />
    <title>He Mat Troi 3D — Solar System Simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='20' fill='%23ffcc33'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%234488ff' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Canvas 3D sẽ được gắn vào đây -->
    <div id="scene-container"></div>

    <!-- Overlay nhãn thiên thể (HTML, cập nhật vị trí mỗi frame) -->
    <div id="labels-layer" aria-hidden="true"></div>

    <!-- Thanh trạng thái: online/offline, tuổi dữ liệu, nguồn -->
    <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>

    <!-- Thanh công cụ -->
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Thanh cong cu"></div>

    <!-- Bảng thông tin hành tinh đã chọn -->
    <div id="info-panel" class="info-panel" role="region" aria-label="Thong tin hanh tinh" hidden></div>

    <!-- Màn hình yêu cầu xoay ngang (chỉ hiện trên điện thoại ở chế độ dọc) -->
    <div id="orientation-guard" class="orientation-guard" hidden>
      <div class="orientation-card">
        <div class="orientation-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="18" y="8" width="28" height="48" rx="4" />
            <path d="M40 24 L52 16 L52 48 L40 40" />
            <line x1="26" y1="50" x2="38" y2="50" />
          </svg>
        </div>
        <h1>Xoay điện thoại sang ngang</h1>
        <p>Mô phỏng Hệ Mặt Trời 3D được tối ưu cho màn hình ngang. Vui lòng xoay thiết bị để tiếp tục.</p>
        <button id="btn-request-landscape" type="button" class="btn-primary">Chuyển sang ngang</button>
        <p class="orientation-hint">Nếu nút không hoạt động, hãy tự xoay máy và tắt khóa màn hình xoay.</p>
      </div>
    </div>

    <!-- Cảnh báo dữ liệu cũ -->
    <div id="stale-warning" class="stale-warning" hidden role="alert"></div>

    <!-- Cấu hình: URL backend.
         Rỗng = cùng origin (deploy chung 1 dịch vụ Render).
         Nếu deploy client lên Firebase Hosting và server lên Render riêng,
         điền URL backend Render (không có dấu gạch chéo cuối), ví dụ:
         window.__API_BASE__ = 'https://solar-system-3d.onrender.com';
         Sau đó build lại client trước khi deploy lên Firebase. -->
    <script>window.__API_BASE__ = '';</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
