# ===== Cấu hình Render cho Solar System 3D (backend only) =====
# Kiến trúc: Backend trên Render, Client trên Firebase Hosting (project: hy-solar-3d).
#
# Cách dùng:
#   1. Đẩy repo này lên GitHub.
#   2. Render Dashboard -> New -> Web Service (hoặc Blueprint) -> chọn repo.
#   3. Render tự đọc file này, build thư mục server/ và chạy.
#   4. Client deploy riêng lên Firebase (đã cấu hình sẵn .firebaserc = hy-solar-3d).
#
# Backend URL sau khi deploy: https://universe-simulation-hy.onrender.com
# (đã đặt sẵn trong client/public/config.js và client/dist/config.js).

services:
  - type: web
    name: universe-simulation-hy
    env: node
    plan: free
    rootDir: server
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JPL_TIMEOUT_MS
        value: "15000"
      - key: JPL_MAX_RETRIES
        value: "2"
      - key: CACHE_TTL_MS
        value: "1800000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # Cho phép client Firebase gọi API. Thay bằng origin của bạn nếu đổi project.
      - key: CORS_ORIGINS
        value: "https://hy-solar-3d.web.app,https://hy-solar-3d.firebaseapp.com"
