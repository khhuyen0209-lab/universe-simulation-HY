# .github/workflows/deploy-firebase.yml
# Tự động build client (Vite) và deploy lên Firebase Hosting khi push lên main.
# Như vậy KHÔNG cần cài Node/npm hay build trên điện thoại/Termux.
#
# Cần thiết lập trên GitHub repo: Settings → Secrets and variables → Actions:
#   FIREBASE_SERVICE_ACCOUNT: nội dung JSON của service account Firebase
#     (tạo ở Firebase Console → Project Settings → Service accounts → Generate new private key).
#   FIREBASE_PROJECT_ID: ID dự án Firebase của bạn.
#
# File firebase.json nằm ở client/, nên entryPoint = client.

name: Deploy client to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client (Vite)
        run: npm run build
        env:
          # Nếu cần inject API base lúc build (không bắt buộc vì dùng window.__API_BASE__ runtime).
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: client
          channelId: live
